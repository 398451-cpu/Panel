<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel of Experts — Log In</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="nav">
      <a class="logo" href="index.html">
        <svg viewBox="0 0 32 32" fill="none">
          <rect x="2" y="2" width="12" height="12" rx="3" fill="#4f46e5"/>
          <rect x="18" y="2" width="12" height="12" rx="3" fill="#818cf8"/>
          <rect x="2" y="18" width="12" height="12" rx="3" fill="#818cf8"/>
          <rect x="18" y="18" width="12" height="12" rx="3" fill="#4f46e5"/>
        </svg>
        <span>Panel of Experts</span>
      </a>
      <div class="links">
        <a href="index.html">Home</a>
        <a class="btn btn-primary" href="signup.html">Get Started</a>
      </div>
    </nav>

    <main class="auth-wrap">
      <div class="auth-card">
        <h1>Log In</h1>
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" minlength="8" required />
          </div>
          <div class="field" style="display:flex; justify-content:space-between; align-items:center; font-size:13px;">
            <label style="margin:0; display:flex; align-items:center; gap:6px; font-weight:400; color:var(--muted); cursor:pointer;">
              <input type="checkbox" id="remember" style="width:auto;" /> Remember me
            </label>
            <a href="#" id="forgotLink">Forgot password?</a>
          </div>
          <button type="submit" class="full-btn" id="submitBtn">Log In</button>
          <div class="message" id="message" role="alert"></div>
        </form>
        <p class="under-form">New here? <a href="signup.html">Create an account</a></p>
      </div>
    </main>

    <script>
      const form = document.getElementById("loginForm");
      const email = document.getElementById("email");
      const password = document.getElementById("password");
      const message = document.getElementById("message");
      const submitBtn = document.getElementById("submitBtn");

      function showMessage(text, kind) {
        message.textContent = text;
        message.className = "message " + kind;
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
        const passOk = password.value.length >= 8;

        if (!emailOk) { showMessage("Please enter a valid email address.", "error"); email.focus(); return; }
        if (!passOk) { showMessage("Password must be at least 8 characters.", "error"); password.focus(); return; }

        submitBtn.disabled = true;
        submitBtn.textContent = "Logging in…";
        showMessage("", "");

        // Placeholder for real authentication. Replace with a fetch() call
        // to your backend / auth provider when it exists.
        setTimeout(function () {
          window.location.href = "dashboard.html";
        }, 700);
      });

      document.getElementById("forgotLink").addEventListener("click", function (e) {
        e.preventDefault();
        showMessage("Password reset page hasn't been built yet.", "error");
      });
    </script>
  </body>
</html>
